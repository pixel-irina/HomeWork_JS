<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Калькулятор</title>
</head>
<body>
    <h2>Калькулятор</h2>
<div>
    <input type="number" id="num1" placeholder="Первое число">
</div>
<div>
    <input type="number" id = "num2" placeholder="Второе число">
</div>
<div>
    <button class="button" onclick="add()">+</button>
    <button class="button" onclick="subtract()">−</button>
    <button class="button" onclick="multiply()">×</button>
    <button class="button" onclick="divide()">÷</button>
</div>

<div>
    <input type="text" id="result" placeholder="Результат" readonly>
</div>
<div>
    <button class="button" onclick="clearFields()">Очистить</button>
</div>

    <script src="app.js"></script>
</body>
</html>
